# Server & DoS Limits
server.port=8080
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-connections=200
server.tomcat.accept-count=100
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Production Error & Debug Hardening (never leak stack traces or internal messages)
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
logging.level.root=WARN
logging.level.com.chainguard=INFO

# MySQL 8+ Datasource (127.0.0.1 avoids macOS socket/localhost mismatch; allowPublicKeyRetrieval handles caching_sha2_password)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/chain_of_custody?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Never auto-modify schema/triggers/views from Java
spring.sql.init.mode=never

# JWT Configuration (8 hours = 28800000 ms; if JWT_SECRET is unset, an ephemeral 256-bit key is generated at startup)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=28800000

# Strict CORS origins (no wildcards)
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174
